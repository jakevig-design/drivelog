[project]
name = "drivelog"
version = "0.1.0"
description = "Local history of every road driven, from a Google Timeline export"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "ijson>=3.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyarrow>=25.0.1",
]

[project.scripts]
drivelog = "drivelog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
